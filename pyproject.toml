[project]
name = "vira-assistant"
version = "0.5.0"
description = "Personal AI assistant on Telegram — reminders, expenses, reports, notes and voice. Local LLM, Persian + English."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Rushqp" }]
dependencies = [
    "aiogram>=3.20,<4",
    "aiohttp-socks>=0.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "jdatetime>=5.0",
    "loguru>=0.7",
    "openai>=1.50,<4",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # emoji / Persian characters are intentional
    "RUF012",  # SQLAlchemy `__table_args__` dicts are class attributes by design
]
