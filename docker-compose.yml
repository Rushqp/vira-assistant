# Services:
#   bot          — the Telegram bot (always)
#   ollama       — local LLM server        ┐ enabled by COMPOSE_PROFILES=ollama in .env;
#   ollama-init  — pulls the profile model ┘ leave it empty when PROFILE=remote

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vira-assistant:latest
    container_name: vira-bot
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false # not started with PROFILE=remote
    # The bot uses long polling: no ports are exposed.

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: vira-ollama
    profiles: [ollama]
    volumes:
      - ./models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m} # how long the model stays in RAM after use
      OLLAMA_NUM_PARALLEL: 1 # single user: one request at a time saves memory
      OLLAMA_MAX_LOADED_MODELS: 1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # No ports: Ollama is reachable only from the bot over the internal network.

  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: vira-ollama-init
    profiles: [ollama]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./docker/ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
